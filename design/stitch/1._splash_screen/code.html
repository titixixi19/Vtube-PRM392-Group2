<!-- Ambient Atmospheric Glow -->
<div class="absolute -top-32 left-1/2 -translate-x-1/2 w-80 h-80 bg-primary-container/15 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-64 h-64 bg-secondary-container/5 rounded-full blur-2xl pointer-events-none"></div>
<!-- Main Center Brand Identity -->
<div class="flex flex-col items-center justify-center my-auto">
<!-- Tactile Glowing Logo Container -->
<div class="relative group cursor-pointer transition-transform duration-500 active:scale-95">
<!-- Glow Underlay -->
<div class="absolute -inset-2 bg-gradient-to-r from-primary-container via-primary to-secondary-container rounded-3xl blur-xl opacity-40 animate-pulse"></div>
<!-- Logo Body (Crimson rounded rectangle with smooth bevel) -->
<div class="relative w-28 h-20 bg-gradient-to-br from-primary-container to-[#c00100] rounded-2xl flex items-center justify-center shadow-2xl">
<!-- Play Icon Button Shape -->
<div class="w-0 h-0 border-y-[13px] border-y-transparent border-l-[22px] border-l-surface ml-1 drop-shadow-md"></div>
<!-- Subtle Specular Reflection Highlight -->
<div class="absolute inset-x-2 top-1 h-3 bg-white/20 rounded-full blur-[1px]"></div>
</div>
</div>
<!-- Wordmark & Tagline -->
<div class="mt-8 flex flex-col items-center gap-space-xs text-center">
<div class="flex items-center tracking-tight">
<span class="font-headline-lg text-headline-lg text-on-surface tracking-wider">V</span>
<span class="font-headline-lg text-headline-lg text-primary tracking-wider">Tube</span>
</div>
<p class="font-label-md text-label-md text-tertiary tracking-widest uppercase opacity-75">
        Watch • Create • Connect
      </p>
</div>
<!-- Live Decorative Audio / Streaming Waves Pill -->

</div>
<!-- Bottom Section: Loading Indicator & App Version -->
<div class="w-full flex flex-col items-center justify-end pb-8 gap-space-md"><div class="flex flex-col items-center gap-space-md"><span class="material-symbols-outlined text-sm animate-spin text-primary">progress_activity</span><span class="font-label-sm text-label-sm text-tertiary opacity-60 tracking-wider">v1.0.0 (Official Build)</span></div></div>
</div>
<script>
  (function() {
    const bar = document.getElementById('splash-progress');
    const status = document.getElementById('loading-status');
    const steps = [
      { progress: '25%', text: 'Đang kết nối hệ thống...' },
      { progress: '58%', text: 'Tối ưu hoá đường truyền...' },
      { progress: '85%', text: 'Tải đề xuất cho bạn...' },
      { progress: '100%', text: 'Sẵn sàng!' }
    ];
    let stepIndex = 0;

    const interval = setInterval(() => {
      if (stepIndex < steps.length) {
        if (bar) bar.style.width = steps[stepIndex].progress;
        if (status) status.textContent = steps[stepIndex].text;
        stepIndex++;
      } else {
        clearInterval(interval);
      }
    }, 450);
  })();
</script></main>

</body></html>
