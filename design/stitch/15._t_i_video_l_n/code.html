<script>
  (function() {
    // Dynamic character counter for Title input
    var titleInput = document.getElementById('videoTitle');
    var counter = document.getElementById('titleCounter');
    if (titleInput && counter) {
      titleInput.addEventListener('input', function() {
        var len = titleInput.value.length;
        counter.textContent = len + '/100';
        if (len >= 95) {
          counter.classList.remove('text-outline');
          counter.classList.add('text-error');
        } else {
          counter.classList.remove('text-error');
          counter.classList.add('text-outline');
        }
      });
    }

    // Interactive pause/resume state on upload status
    var pauseBtn = document.getElementById('btnTogglePause');
    var pauseIcon = document.getElementById('pauseIcon');
    var isPaused = false;
    if (pauseBtn && pauseIcon) {
      pauseBtn.addEventListener('click', function() {
        isPaused = !isPaused;
        pauseIcon.textContent = isPaused ? 'play_arrow' : 'pause';
        pauseBtn.setAttribute('aria-label', isPaused ? 'Tiếp tục tải lên' : 'Tạm dừng tải lên');
      });
    }
  })();
