: "#ebbbb4", "tertiary-container": "#909191", "secondary-fixed": "#d0e4ff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-md": "0.75rem", "space-xl": "1.5rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-lg": "1rem", "margin": "0.75rem", "gutter": "0.75rem" }, fontFamily: { "headline-md": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "title-md": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "body-md": ["Inter"] }, fontSize: { "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-md": ["15px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-sm": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-lg": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "body-md": ["13px", { "lineHeight": "18px", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.45)]"><div class="flex justify-between items-center px-margin h-6 text-on-surface-variant"><span class="font-label-sm text-label-sm font-semibold tracking-tight text-on-surface">09:41</span><div class="flex items-center gap-space-xs text-on-surface"><span class="material-symbols-outlined text-sm leading-none">signal_cellular_alt</span><span class="material-symbols-outlined text-sm leading-none">wifi</span><span class="material-symbols-outlined text-sm leading-none">battery_full</span></div></div></header><main class="flex flex-col relative w-full pb-safe bg-surface min-h-screen pt-11"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Subtle Ambient Glow -->
<div class="relative w-full overflow-hidden flex flex-col items-center">
<div class="absolute -top-16 w-56 h-56 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header & Hero Identity -->
<div class="relative z-10 flex flex-col items-center text-center mt-space-md mb-space-xl w-full">
<div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center shadow-md mb-space-md">
<div class="w-11 h-8 bg-primary-container rounded-xl flex items-center justify-center shadow-inner relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-black/20 to-transparent"></div>
<span class="material-symbols-outlined text-on-primary text-2xl relative z-10" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</div>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs">Đăng nhập</h2>
<p class="font-body-md text-body-md text-tertiary">để tiếp tục với VTube</p>
</div>
<!-- Interactive Login Card -->
<div class="w-full bg-surface-container-low rounded-xl p-space-lg shadow-sm flex flex-col gap-space-md">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- Input: Identifier -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="identifier">Email hoặc số điện thoại</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-tertiary text-xl pointer-events-none transition-colors" id="identifierIcon">mail</span>
<input class="w-full h-12 bg-surface-container rounded-lg pl-11 pr-4 font-body-md text-body-md text-on-surface placeholder:text-tertiary/60 outline-none focus:bg-surface-container-high transition-all" id="identifier" onblur="document.getElementById('identifierIcon').classList.remove('text-secondary')" onfocus="document.getElementById('identifierIcon').classList.add('text-secondary')" placeholder="name@example.com hoặc số điện thoại" required="" type="text">
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="password">Mật khẩu</label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-tertiary text-xl pointer-events-none transition-colors" id="passwordIcon">lock</span>
<input class="w-full h-12 bg-surface-container rounded-lg pl-11 pr-11 font-body-md text-body-md text-on-surface placeholder:text-tertiary/60 outline-none focus:bg-surface-container-high transition-all" id="password" onblur="document.getElementById('passwordIcon').classList.remove('text-secondary')" onfocus="document.getElementById('passwordIcon').classList.add('text-secondary')" placeholder="Nhập mật khẩu của bạn" required="" type="password">
<button aria-label="Hiện hoặc ẩn mật khẩu" class="absolute right-2.5 w-9 h-9 flex items-center justify-center text-tertiary active:scale-95 transition-transform" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-xl" id="eyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-0.5">
<a class="font-label-md text-label-md text-secondary hover:underline transition-all" href="#">
            Quên mật khẩu?
          </a>
</div>
<!-- Submit Button -->
<button class="w-full h-12 mt-space-xs bg-primary-container text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-space-xs shadow-md active:scale-[0.98] transition-transform font-semibold" id="submitBtn" type="submit">
<span class="">Đăng nhập</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center justify-center my-space-xs">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute px-space-sm bg-surface-container-low font-label-sm text-label-sm text-tertiary uppercase tracking-wider">hoặc</span>
</div>
<!-- Third-party Auth: Google -->
<button class="w-full h-12 bg-surface-container hover:bg-surface-container-high rounded-full flex items-center justify-center gap-space-sm font-label-lg text-label-lg text-on-surface active:scale-[0.98] transition-all" onclick="handleGoogleAuth()" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24Z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" fill="#EA4335"></path>
</svg>
<span class="">Tiếp tục với Google</span>
</button>
<!-- Quick One-Tap Device Hint / Recent Activity Carousel snippet -->
<div class="mt-space-xs p-space-sm bg-surface-container rounded-xl flex items-center justify-between">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-lg">shield_person</span>
</div>
<div class="min-w-0">
<p class="font-label-md text-label-md text-on-surface truncate font-medium">Bảo mật tài khoản</p>
<p class="font-label-sm text-label-sm text-tertiary truncate">Hỗ trợ xác thực 2 lớp thông minh</p>
</div>
</div>
<span class="material-symbols-outlined text-tertiary text-base shrink-0">verified</span>
</div>
</div>
<!-- Footer Register CTA -->
<div class="mt-space-lg flex items-center justify-center gap-1.5 text-center">
<span class="font-body-md text-body-md text-tertiary">Chưa có tài khoản?</span>
<a class="font-label-lg text-label-lg text-secondary font-semibold hover:underline" href="#">Đăng ký ngay</a>
</div>
<!-- Security Badges & Micro Delights -->
<div class="mt-space-xl flex items-center justify-center gap-space-md opacity-70">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-tertiary text-sm">lock</span>
<span class="font-label-sm text-label-sm text-tertiary">Mã hóa SSL 256-bit</span>
</div>
<span class="w-1 h-1 rounded-full bg-surface-variant"></span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-tertiary text-sm">public</span>
<span class="font-label-sm text-label-sm text-tertiary">Tiêu chuẩn toàn cầu</span>
</div>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (!pwdInput || !eyeIcon) return;
    
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility';
      eyeIcon.classList.add('text-secondary');
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility_off';
      eyeIcon.classList.remove('text-secondary');
    }
  }

  function handleLoginSubmit() {
    const btn = document.getElementById('submitBtn');
    if (!btn) return;
    const originalContent = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span>';
    
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-xl">check</span> <span>Thành công</span>';
      setTimeout(() => {
        btn.innerHTML = originalContent;
        btn.disabled = false;
      }, 1200);
    }, 1000);
  }

  function handleGoogleAuth() {
    // Interactive micro-feedback
    const activeEl = document.activeElement;
    if (activeEl) activeEl.blur();
  }
</script></main>

</body></html>
